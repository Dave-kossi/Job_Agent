name: Job Agent Automation

on:
  schedule:
    # 08h30, 12h30, 15h30 et 18h30 heure de France (UTC+2)
    - cron: '30 6,10,13,16 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter l'Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py

      - name: Sauvegarder les résultats dans le dépôt
        run: |
          git config --global user.name 'Job-Agent-Bot'
          git config --global user.email 'bot@github.com'
          git add data/
          git commit -m "Auto-update des offres [skip ci]" || exit 0
          git push
